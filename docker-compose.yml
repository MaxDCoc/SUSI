services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: susi
      POSTGRES_USER: susi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definí POSTGRES_PASSWORD en el archivo .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U susi -d susi"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://susi:${POSTGRES_PASSWORD}@db:5432/susi
      SUSI_MEDIA_ROOT: /data/media
    ports:
      - "8000:8000"
    volumes:
      - media:/data/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  media:
